[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]

[project]
name = "adamfit"
version = "0.1.0"
description = "Adams personal fitness webapp."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyarrow",
    "numpy",
    "pandas",
    "tabulate",
    "duckdb",
    "streamlit>=1.65.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "argon2-cffi>=25.1.0",
]


[project.scripts]
adamfit-create-user = "adamfit.cli.create_user:main"


[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
]

[tool.uv]
# Ignore packages released in the last 7 days
exclude-newer = "1 week"
